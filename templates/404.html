{% extends 'base.html' %}

{% block title %}Page Not Found | {{ site.site_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-20 text-center">
    <div
        class="p-6 rounded-md bg-white dark:bg-[#1e1d1c] border border-[#e8e4de] dark:border-[#2e2c2a] space-y-5">
        <span class="font-serif text-4xl text-[#b85c38]">404</span>
        <div class="space-y-1">
            <h1 class="font-serif text-xl text-[#1a1a1a] dark:text-[#faf9f7]">Page Not Found</h1>
            <p class="text-[#6b6560] dark:text-[#9c9690] text-xs">
                The article or page you are looking for does not exist or has been moved.
            </p>
        </div>
        <div class="pt-2 flex justify-center gap-2 text-xs">
            <a href="{% url 'blog:home' %}"
                class="px-3.5 py-1.5 rounded-md bg-[#1a1a1a] dark:bg-[#faf9f7] text-white dark:text-[#1a1a1a] font-medium">
                Return Home
            </a>
            <a href="{% url 'blog:blog_list' %}"
                class="px-3.5 py-1.5 rounded-md border border-[#e8e4de] dark:border-[#2e2c2a] text-[#6b6560] dark:text-[#9c9690] font-medium hover:bg-[#f4f2ee] dark:hover:bg-[#292725] transition">
                Explore Articles
            </a>
        </div>
    </div>
</div>
{% endblock %}
