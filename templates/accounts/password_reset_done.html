{% extends 'base.html' %}

{% block title %}Reset Email Sent | {{ site.site_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12 text-center">
    <div class="p-6 md:p-8 rounded-md bg-white dark:bg-[#1e1d1c] border border-[#e8e4de] dark:border-[#2e2c2a] space-y-4">
        <h1 class="font-serif font-medium text-2xl text-[#1a1a1a] dark:text-[#faf9f7]">Check your inbox</h1>
        <p class="text-xs text-[#6b6560] dark:text-[#9c9690] leading-relaxed">
            We have emailed you instructions for setting your password, if an account exists with the email address you entered.
        </p>
        <a href="{% url 'accounts:login' %}" class="inline-block mt-4 px-5 py-2 rounded-md bg-[#1a1a1a] dark:bg-[#faf9f7] text-white dark:text-[#1a1a1a] font-medium text-xs hover:bg-[#333333] dark:hover:bg-[#e5e2dc] transition">
            Return to Sign in
        </a>
    </div>
</div>
{% endblock %}
