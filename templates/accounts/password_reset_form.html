{% extends 'base.html' %}

{% block title %}Reset Password | {{ site.site_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="p-6 md:p-8 rounded-md bg-white dark:bg-[#1e1d1c] border border-[#e8e4de] dark:border-[#2e2c2a] space-y-6">
        
        <div class="text-center space-y-1">
            <h1 class="font-serif font-medium text-2xl text-[#1a1a1a] dark:text-[#faf9f7]">Reset password</h1>
            <p class="text-xs text-[#6b6560] dark:text-[#9c9690]">Enter your account email to receive a password reset link.</p>
        </div>

        <form method="POST" action="{% url 'accounts:password_reset' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-[#6b6560] dark:text-[#9c9690] mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full px-3 py-2 rounded-md border border-[#e8e4de] dark:border-[#2e2c2a] bg-[#faf9f7] dark:bg-[#151413] text-[#1a1a1a] dark:text-[#faf9f7] text-xs focus:outline-none focus:border-[#1a1a1a] dark:focus:border-[#faf9f7] transition" placeholder="you@example.com">
            </div>

            <button type="submit" class="w-full py-2.5 px-4 rounded-md bg-[#1a1a1a] dark:bg-[#faf9f7] text-white dark:text-[#1a1a1a] font-medium text-xs hover:bg-[#333333] dark:hover:bg-[#e5e2dc] transition">
                Send Reset Link
            </button>
        </form>

        <div class="pt-4 border-t border-[#e8e4de] dark:border-[#2e2c2a] text-center text-xs text-[#6b6560] dark:text-[#9c9690]">
            Remembered your password? <a href="{% url 'accounts:login' %}" class="font-medium text-[#b85c38] hover:underline">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
