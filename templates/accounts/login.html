{% extends 'base.html' %}

{% block title %}Sign in | {{ site.site_name }}{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto px-4 py-16">
    <div class="p-6 rounded-md bg-white dark:bg-[#1e1d1c] border border-[#e8e4de] dark:border-[#2e2c2a] space-y-6">
        
        <div class="text-center space-y-1">
            <h1 class="font-serif font-medium text-2xl text-[#1a1a1a] dark:text-[#faf9f7]">Sign in</h1>
            <p class="text-xs text-[#6b6560] dark:text-[#9c9690]">Welcome back to {{ site.site_name }}</p>
        </div>

        <form method="POST" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-[#6b6560] dark:text-[#9c9690] mb-1">Username or Email</label>
                {{ form.username }}
            </div>
            <div>
                <label class="block text-xs font-medium text-[#6b6560] dark:text-[#9c9690] mb-1">Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="w-full py-2 px-4 rounded-md bg-[#1a1a1a] dark:bg-[#faf9f7] text-white dark:text-[#1a1a1a] font-medium text-xs hover:bg-[#333333] dark:hover:bg-[#e5e2dc] transition">
                Sign in
            </button>
        </form>

        <div class="pt-4 border-t border-[#e8e4de] dark:border-[#2e2c2a] text-center text-xs text-[#6b6560] dark:text-[#9c9690]">
            Don't have an account? <a href="{% url 'accounts:register' %}" class="font-medium text-[#b85c38] hover:underline">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
