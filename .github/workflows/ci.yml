name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blog_saas_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django Configurations & Migration Consistency
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: blog_saas_db
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          SECRET_KEY: ci-test-secret-key-production-hardened-64-character-string-here-12345
        run: |
          python manage.py check
          python manage.py makemigrations --check

      - name: Run Production Deployment Security Checks
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: blog_saas_db
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          SECRET_KEY: ci-test-secret-key-production-hardened-64-character-string-here-12345
          ALLOWED_HOSTS: localhost,127.0.0.1,yourdomain.com
        run: |
          python manage.py check --deploy --settings=config.settings.prod

      - name: Execute Automated Test Suite
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: blog_saas_db
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          SECRET_KEY: ci-test-secret-key-production-hardened-64-character-string-here-12345
        run: |
          python manage.py test accounts.tests blog.tests content.tests dashboard.tests
